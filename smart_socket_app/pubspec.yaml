name: smart_socket_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  provider: ^6.0.5
  # MQTT 客户端
  mqtt_client: ^10.0.1
  # 本地存储 (保存功率限制值)
  shared_preferences: ^2.2.0
  # 播放报警声音 (使用系统铃声，无需额外素材)
  flutter_ringtone_player: ^3.2.0
  # 图标库
  font_awesome_flutter: ^10.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
